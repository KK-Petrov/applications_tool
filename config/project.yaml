# Application Hub parameters. Never hard-code a value that belongs here.

storage:
  # Absolute path to the user's data folder. Recommended: a folder inside OneDrive for automatic backup.
  # source: user decision (30 Oct 2026). Set by the user after cloning; tests override it.
  data_dir: "C:/Users/kaloy/OneDrive/Documents/Application information"
  log_max_bytes: 1000000          # rotating log size; source: recommended
  log_backup_count: 2             # rotated log files kept; source: recommended (DECISIONS #11)
  write_retries: 3                # atomic-replace attempts when OneDrive briefly locks a file; source: recommended (DECISIONS #11)
  write_retry_delay_s: 0.2        # wait between attempts, multiplied by the attempt number

app:
  host: 127.0.0.1                 # local only; source: recommended
  port: 8765

time:
  display_zones:                  # header selector options; source: user (ET while in Charlottesville, Rotterdam later)
    - {tz: America/New_York, label: "Eastern Time (Charlottesville)", clock: 12h, place: null}
    - {tz: Europe/Amsterdam, label: "Central European Time (Rotterdam)", clock: 24h, place: Rotterdam}
    # place: printed after the zone abbreviation for times shown in that display zone, e.g.
    # "16 Dec 2026, 05:59 CET (Rotterdam)"; source: user (DECISIONS #20)
  zone_abbreviations:             # printed next to every time; zones not listed use their tzname (CET, CEST, UTC)
    America/New_York: ET          # source: docs/02 §1 (ET, CT, CET, CEST)
    America/Chicago: CT
    America/Denver: MT
    America/Los_Angeles: PT
  default_clock: 12h              # zones not in display_zones (school zones are US: 12-hour, docs/02 §1)
  formats:                        # docs/02 §1; placeholders filled by hub.rules.timezones (DECISIONS #20)
    long: "{day} {month} {year}, {time} {zone}"     # 15 Dec 2026, 11:59 pm ET
    short: "{day} {month}, {time} {zone}"           # 16 Dec, 05:59 CET (Rotterdam)
    date: "{day} {month} {year}"                    # 3 Nov 2026 (dates without a time, e.g. request-by dates)
    time_12h: "{hour12}:{minute} {ampm}"            # US zones
    time_24h: "{hour24}:{minute}"                   # European zones
  default_display_tz: America/New_York
  default_reminder_tz: America/New_York
  assumed_deadline_time: "23:59"  # used when a deadline's time is unknown; shown as "(time to verify)"

urgency:
  orange_days: 14                 # source: recommended (two weeks matches the D−14 reminders)
  red_days: 2

letters:
  default_required: 2             # when a programme does not state it; most programmes ask for 2–3; source: recommended
  max_extra: 1                    # over-ask warning beyond required + 1; source: recommended
  follow_up_days: 7               # source: recommended
  request_soon_days: 7            # next action "Send request by …" is urgent within this many days (docs/02 §4 priority 4; DECISIONS #39)

reminders:                        # offsets in days before the deadline's local date; source: recommended (docs/02 §5)
  letters_request_days: 42        # six weeks' notice for recommenders
  documents_days: 21
  letters_check_days: 14
  essay_final_days: 7
  deadline_alert_days: [14, 7, 2, 1]
  interview_eve_days: 1
  time_of_day: "09:00"            # in settings.reminder_tz
  rule_event_minutes: 15
  deadline_popups_minutes: [1440, 120]
  interview_popups_minutes: [1440, 60]

email:
  min_words: 180                  # source: recommended; long enough for the five parts, short enough to read
  max_words: 280
  subject_template: "Request for a letter of recommendation: {programme_type}"   # source: user (Phase 2b approval)
  programme_type: "master's programmes in finance"   # covers MFin, MiF and MSFE; source: user (Phase 2b approval)
  sign_off: "Kind regards,"
  # deadline_text in the request email, in the school's zone (docs/04 §2.1). {month_long} = "December".
  # A deadline whose time is not confirmed is written with date_only (DECISIONS, Phase 2b).
  deadline_format: "{day} {month_long} {year}, {time} {zone}"   # 15 December 2026, 11:59 pm ET
  deadline_date_only_format: "{day} {month_long} {year}"        # 7 January 2027

claude:
  backend: cli                    # AI backend: only "cli" (headless Claude Code) exists; docs/04 §1.2 (DECISIONS #50)
  path: null                      # null → shutil.which("claude"); env HUB_CLAUDE_PATH overrides (tests: tests/fakes/fake_claude.py)
  timeout_s: 120
  research_timeout_s: 300
  usage_log: reports/ai_usage.jsonl
  max_turns: 3                    # headless lockdown: turn cap per call (DECISIONS, Phase 2b); source: user
  eval_concurrency: 3             # parallel live calls in tasks.py eval-email; source: recommended (rate limits)

evaluation:
  ratings: [strong, adequate, weak]
  criteria: [structure, content_fit, programme_fit, accuracy]
  max_comment_words: 60           # source: user (never rewrite)

research:
  official_shared_domains: [mba.com]   # official non-university bodies accepted as sources (GMAC); source: user (DECISIONS #37)

wrong_school:
  own_background_terms: [RSM, Erasmus, Rotterdam, UVA, Virginia, McIntire]   # source: user's background
  extra_terms: [Wharton, Stanford, Harvard, Yale, Berkeley, Haas, NYU, Stern, Carnegie Mellon, CMU,
                Baruch, Cornell, Duke, Fuqua, Kellogg, Northwestern, UCLA, Anderson, Toronto, Rotman,
                LSE, Oxford, Saïd, Cambridge, Judge, HEC, INSEAD, ETH, Imperial, Bocconi]
  allow_phrases: ["British Columbia", "Columbia River"]

google:
  calendar_name: Applications      # source: user decision
  scopes:
    - https://www.googleapis.com/auth/calendar.app.created
    - https://www.googleapis.com/auth/gmail.send
  client_secret_path: .secrets/client_secret.json
  token_path: .secrets/token.json
  timeout_s: 30
  max_retries: 3

digest:
  lookahead_days: 14
  waiting_days: 7
  unverified_window_days: 60
  send_when_empty: false

schedule:
  sync_logon_delay_minutes: 2
  digest_logon_delay_minutes: 3
  sync_daily_time: "12:00"

performance:
  sheet_professors_benchmark: 40   # C-2a-03 fixture size
  test_workers: 8                  # pytest-xdist workers for test-fast and test; fastest measured (DECISIONS #38)
  test_fast_warn_seconds: 45       # tasks.py test-fast warns above this; C-0-02 limit is 60 s
