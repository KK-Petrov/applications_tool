# Application Hub parameters. Never hard-code a value that belongs here.

storage:
  # Absolute path to the user's data folder. Recommended: a folder inside OneDrive for automatic backup.
  # source: user decision (30 Oct 2026). Set by the user after cloning; tests override it.
  data_dir: "C:/Users/<you>/OneDrive/ApplicationHub"
  log_max_bytes: 1000000          # rotating log size; source: recommended

app:
  host: 127.0.0.1                 # local only; source: recommended
  port: 8765

time:
  display_zones:                  # header selector options; source: user (ET while in Charlottesville, Rotterdam later)
    - {tz: America/New_York, label: "Eastern Time (Charlottesville)", clock: 12h}
    - {tz: Europe/Amsterdam, label: "Central European Time (Rotterdam)", clock: 24h}
  default_display_tz: America/New_York
  default_reminder_tz: America/New_York
  assumed_deadline_time: "23:59"  # used when a deadline's time is unknown; shown as "(time to verify)"

urgency:
  orange_days: 14                 # source: recommended (two weeks matches the D−14 reminders)
  red_days: 2

letters:
  default_required: 2             # when a programme does not state it; most programmes ask for 2–3; source: recommended
  max_extra: 1                    # over-ask warning beyond required + 1; source: recommended
  follow_up_days: 7               # source: recommended

reminders:                        # offsets in days before the deadline's local date; source: recommended (docs/02 §5)
  letters_request_days: 42        # six weeks' notice for recommenders
  documents_days: 21
  letters_check_days: 14
  essay_final_days: 7
  deadline_alert_days: [14, 7, 2, 1]
  interview_eve_days: 1
  time_of_day: "09:00"            # in settings.reminder_tz
  rule_event_minutes: 15
  deadline_popups_minutes: [1440, 120]
  interview_popups_minutes: [1440, 60]

email:
  min_words: 180                  # source: recommended; long enough for the five parts, short enough to read
  max_words: 280
  subject_template: "Request for a letter of recommendation: {programme_type} applications"
  sign_off: "Kind regards,"

claude:
  path: null                      # null → shutil.which("claude"); tests point this at tests/fakes/fake_claude.py
  timeout_s: 120
  research_timeout_s: 300
  usage_log: reports/ai_usage.jsonl

evaluation:
  ratings: [strong, adequate, weak]
  criteria: [structure, content_fit, programme_fit, accuracy]
  max_comment_words: 60           # source: user (never rewrite)

wrong_school:
  own_background_terms: [RSM, Erasmus, Rotterdam, UVA, Virginia, McIntire]   # source: user's background
  extra_terms: [Wharton, Stanford, Harvard, Yale, Berkeley, Haas, NYU, Stern, Carnegie Mellon, CMU,
                Baruch, Cornell, Duke, Fuqua, Kellogg, Northwestern, UCLA, Anderson, Toronto, Rotman,
                LSE, Oxford, Saïd, Cambridge, Judge, HEC, INSEAD, ETH, Imperial, Bocconi]
  allow_phrases: ["British Columbia", "Columbia River"]

google:
  calendar_name: Applications      # source: user decision
  scopes:
    - https://www.googleapis.com/auth/calendar.app.created
    - https://www.googleapis.com/auth/gmail.send
  client_secret_path: .secrets/client_secret.json
  token_path: .secrets/token.json
  timeout_s: 30
  max_retries: 3

digest:
  lookahead_days: 14
  waiting_days: 7
  unverified_window_days: 60
  send_when_empty: false

schedule:
  sync_logon_delay_minutes: 2
  digest_logon_delay_minutes: 3
  sync_daily_time: "12:00"

performance:
  sheet_professors_benchmark: 40   # C-2a-03 fixture size
