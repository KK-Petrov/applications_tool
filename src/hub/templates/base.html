<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · Application Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    {% include "_sidebar.html" %}
    <main class="main" id="main">
      <div class="main-inner{% if page.wide %} wide{% endif %}">
        {% include "_header.html" %}
        {% include "_data_errors.html" %}
        <div class="title-row">
          <h1>{{ page.title }}</h1>
          <div class="actions">{% block actions %}{% endblock %}</div>
        </div>
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
</html>
