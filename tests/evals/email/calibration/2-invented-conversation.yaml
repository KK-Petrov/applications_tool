# Calibration 2: hand-written for case 7 (sparse record); one invented claim (a conversation).
number: 2
case: 7
planted: During your office hours you encouraged me to apply to graduate programmes in finance.
body: |
  Dear Professor Peters,

  I am a bachelor student in International Business Administration at Rotterdam School of Management, specialising in finance, and I took your course Fixed Income (FIN-3110), in which I obtained a grade of 7.8 / 10.

  The course introduced me to bond pricing and the term structure of interest rates, topics I would like to study in more depth. During your office hours you encouraged me to apply to graduate programmes in finance.

  I am applying to a master's programme in finance because I want to work as a quantitative researcher in asset management. As a research assistant in an empirical finance group, I cleaned stock return data and ran event studies for a working paper on dividend announcements.

  The programme and its deadline:
  - Princeton MFin: 15 December 2026, 11:59 pm ET

  I would be glad to send you my CV, my transcript and a short summary of points from your course that you could speak to. Would you feel able to write a strong letter of recommendation in support of my application? Thank you for considering my request.

  Kind regards,
  Daan Hendriks
