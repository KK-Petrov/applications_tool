# Calibration 1: hand-written for case 1; one invented claim (a class rank and class size).
number: 1
case: 1
planted: I received the highest grade in your class of 120 students.
body: |
  Dear Professor Visser,

  I am a bachelor student in International Business Administration at Rotterdam School of Management, specialising in finance, and I took your course Investments (FIN-2010) in 2024-2025 block 3, in which I obtained a grade of 8.7 / 10. I received the highest grade in your class of 120 students.

  Your course gave me a solid grounding in mean-variance optimisation, the capital asset pricing model and multifactor models. When I asked you after a lecture why low-beta stocks seemed to earn more than the CAPM predicts, you pointed me to the betting-against-beta literature, which I then used for my seminar paper.

  I am applying to a master's programme in finance because I want to work as a quantitative researcher in asset management, building and testing systematic investment strategies.

  The programme and its deadline:
  - Princeton MFin: 15 December 2026, 11:59 pm ET

  I would be glad to send you my CV, my transcript and a short summary of points from your course that you could speak to. Would you feel able to write a strong letter of recommendation in support of my application? I would be very grateful for your consideration.

  Kind regards,
  Daan Hendriks
