# Calibration 3: hand-written for case 3; one invented claim (a thesis prize).
number: 3
case: 3
planted: My bachelor thesis on yield-curve forecasting won the faculty's thesis prize this summer.
body: |
  Dear Professor Mulder,

  I am a bachelor student in International Business Administration at Rotterdam School of Management, and I took your course Derivatives and Risk Management (FIN-3030) in 2025-2026 block 1, in which I obtained a grade of 9.0 / 10. My bachelor thesis on yield-curve forecasting won the faculty's thesis prize this summer.

  The course covered the pricing of forwards, futures, swaps and options, the Black–Scholes–Merton model and delta hedging. For the course project I wrote a delta-hedging simulation and discussed its results with you in class.

  I am applying to master's programmes in finance because I want to work as a quantitative researcher in asset management.

  The programmes and their deadlines:
  - Princeton MFin: 15 December 2026, 11:59 pm ET
  - MIT Sloan MFin: 5 January 2027
  - Booth MiF: 7 January 2027, 11:59 pm CT
  - Columbia MSFE: 15 January 2027

  I would be glad to send you my CV, my transcript and a short summary of points from your course that you could speak to. Would you feel able to write a strong letter of recommendation for these applications? I would be very grateful for your consideration.

  Kind regards,
  Daan Hendriks
